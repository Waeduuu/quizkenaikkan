<script>

/* =====================================================
   RK GARAGE - SENIOR MECHANIC TEST
   DISCORD WEBHOOK
===================================================== */

const WEBHOOK_URL =
"https://canary.discord.com/api/webhooks/1537805232279650324/GnPIJQABGGBIVPS1dukEoHB2zQOqmXFPeTKPlaN1RDEIUyJedkMNIS5e5KEwRHgcIaSR";


/* =====================================================
   JAWAPAN BETUL
===================================================== */

const correctAnswers = {

    q1: "B",
    q2: "C",
    q3: "C",
    q4: "B",
    q5: "C",
    q6: "C",
    q7: "C",
    q8: "B",
    q9: "C",
    q10: "B",
    q11: "C",
    q12: "C",
    q13: "C",
    q14: "C",
    q15: "C",
    q16: "B",
    q17: "A",
    q18: "A",
    q19: "B",
    q20: "C"

};


/* =====================================================
   TIMER
===================================================== */

let timeLeft = 300;
let submitted = false;

const timerInterval = setInterval(() => {

    if (submitted) {
        return;
    }

    timeLeft--;

    const minutes =
        Math.floor(timeLeft / 60);

    const seconds =
        timeLeft % 60;

    const timer =
        document.getElementById("timer");

    if (timer) {

        timer.textContent =
            `⏱️ ${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;

    }


    if (timeLeft <= 0) {

        clearInterval(timerInterval);

        submitQuiz(true);

    }

}, 1000);


/* =====================================================
   FORM SUBMIT
===================================================== */

document
.getElementById("quizForm")
.addEventListener("submit", function(event) {

    event.preventDefault();

    submitQuiz(false);

});


/* =====================================================
   GET SOAL
===================================================== */

function getQuestionText(questionNumber) {

    const input =
        document.querySelector(
            `input[name="q${questionNumber}"]`
        );

    if (!input) {
        return `Soalan ${questionNumber}`;
    }

    const question =
        input.closest(".question");

    if (!question) {
        return `Soalan ${questionNumber}`;
    }

    const title =
        question.querySelector(".question-title");

    if (!title) {
        return `Soalan ${questionNumber}`;
    }

    return title.innerText
        .replace(/^\d+\.\s*/, "")
        .trim();

}


/* =====================================================
   GET TEXT JAWAPAN
===================================================== */

function getAnswerText(questionNumber, answer) {

    if (
        !answer ||
        answer === "TIDAK DIJAWAB"
    ) {

        return "TIDAK DIJAWAB";

    }


    const input =
        document.querySelector(
            `input[name="q${questionNumber}"][value="${answer}"]`
        );


    if (!input) {

        return answer;

    }


    const label =
        input.closest("label");


    if (!label) {

        return answer;

    }


    return label.innerText
        .replace(/\s+/g, " ")
        .trim();

}


/* =====================================================
   SUBMIT QUIZ
===================================================== */

async function submitQuiz(autoSubmit) {

    if (submitted) {

        return;

    }


    const playerName =
        document
        .getElementById("playerName")
        .value
        .trim();


    const currentRank =
        document
        .getElementById("currentRank")
        .value
        .trim();


    if (!playerName || !currentRank) {

        submitted = false;

        alert(
            "SILA ISI NAMA DAN PANGKAT SEKARANG."
        );

        return;

    }


    submitted = true;

    clearInterval(timerInterval);


    let score = 0;

    let unanswered = 0;

    const details = [];


    /* =================================================
       CHECK 20 SOAL
    ================================================= */

    for (let i = 1; i <= 20; i++) {

        const questionKey =
            "q" + i;


        const selected =
            document.querySelector(
                `input[name="${questionKey}"]:checked`
            );


        const userAnswer =
            selected
            ? selected.value
            : "TIDAK DIJAWAB";


        const correctAnswer =
            correctAnswers[questionKey];


        const isCorrect =
            userAnswer === correctAnswer;


        if (isCorrect) {

            score++;

        }


        if (!selected) {

            unanswered++;

        }


        const questionText =
            getQuestionText(i);


        const userAnswerText =
            getAnswerText(
                i,
                userAnswer
            );


        const correctAnswerText =
            getAnswerText(
                i,
                correctAnswer
            );


        details.push({

            number: i,

            question: questionText,

            answer: userAnswer,

            answerText: userAnswerText,

            correctAnswer: correctAnswer,

            correctAnswerText: correctAnswerText,

            correct: isCorrect

        });

    }


    /* =================================================
       SCORE
    ================================================= */

    const percentage =
        Math.round(
            (score / 20) * 100
        );


    const status =
        score >= 16
        ? "LULUS"
        : "GAGAL";


    /* =================================================
       RESULT PAGE
    ================================================= */

    const result =
        document.getElementById("result");


    result.style.display =
        "block";


    result.className =
        status === "LULUS"
        ? "pass"
        : "fail";


    let resultHTML = `

        <div class="result-title">

            ${
                status === "LULUS"
                ? "🎉 LULUS"
                : "❌ GAGAL"
            }

        </div>


        <div class="result-item">
            👤 Nama:
            <b>${escapeHTML(playerName)}</b>
        </div>


        <div class="result-item">
            🎖️ Pangkat Sekarang:
            <b>${escapeHTML(currentRank)}</b>
        </div>


        <div class="result-item">
            🎯 Pangkat Tujuan:
            <b>Senior Mekanik</b>
        </div>


        <div class="result-item">
            📊 Markah:
            <b>${score}/20</b>
        </div>


        <div class="result-item">
            📈 Score:
            <b>${percentage}%</b>
        </div>


        <div class="result-item">
            ❓ Tidak Dijawab:
            <b>${unanswered}</b>
        </div>

    `;


    if (autoSubmit) {

        resultHTML += `

            <div class="result-item">
                ⏰ Masa habis.
                Quiz telah auto-submit.
            </div>

        `;

    }


    resultHTML += `

        <br>

        <h3>
            📝 DETAIL JAWAPAN
        </h3>

    `;


    /* =================================================
       PAPAR DETAIL
    ================================================= */

    details.forEach(item => {

        if (item.correct) {

            resultHTML += `

                <div class="result-item correct">

                    <b>
                        ${item.number}. ✅ BETUL
                    </b>

                    <br><br>

                    SOAL:
                    <b>
                        ${escapeHTML(item.question)}
                    </b>

                    <br><br>

                    JAWAPAN:
                    <b>
                        ${escapeHTML(item.answerText)}
                    </b>

                </div>

            `;

        } else {

            resultHTML += `

                <div class="result-item wrong">

                    <b>
                        ${item.number}. ❌ SALAH
                    </b>

                    <br><br>

                    SOAL:
                    <b>
                        ${escapeHTML(item.question)}
                    </b>

                    <br><br>

                    JAWAPAN:
                    <b>
                        ${escapeHTML(item.answerText)}
                    </b>

                    <br><br>

                    JAWAPAN BETUL:
                    <b>
                        ${escapeHTML(item.correctAnswerText)}
                    </b>

                </div>

            `;

        }

    });


    result.innerHTML =
        resultHTML;


    /* =================================================
       LOCK QUIZ
    ================================================= */

    document
    .querySelectorAll("input")
    .forEach(input => {

        input.disabled = true;

    });


    document
    .getElementById("submitBtn")
    .disabled = true;


    /* =================================================
       STATUS DISCORD
    ================================================= */

    result.innerHTML += `

        <div
            id="sendingStatus"
            class="sending"
        >
            📤 Menghantar result ke Discord...
        </div>

    `;


    /* =================================================
       SEND DISCORD
    ================================================= */

    const success =
        await sendToDiscord({

            playerName:
                playerName,

            currentRank:
                currentRank,

            score:
                score,

            percentage:
                percentage,

            status:
                status,

            unanswered:
                unanswered,

            autoSubmit:
                autoSubmit,

            details:
                details

        });


    const sendingStatus =
        document.getElementById(
            "sendingStatus"
        );


    if (sendingStatus) {

        if (success) {

            sendingStatus.innerHTML =
                "✅ Result telah dihantar ke Discord.";

        } else {

            sendingStatus.innerHTML =
                "❌ Gagal menghantar result ke Discord.";

        }

    }

}


/* =====================================================
   BUILD DISCORD QUESTION
===================================================== */

function buildQuestionMessage(item) {

    let text = "";

    if (item.correct) {

        text +=
            `**${item.number}. ✅ BETUL**\n`;

    } else {

        text +=
            `**${item.number}. ❌ SALAH**\n`;

    }


    text +=
        `**SOAL:** ${item.question}\n`;


    text +=
        `**JAWAPAN:** ${item.answerText}`;


    if (!item.correct) {

        text +=
            `\n**JAWAPAN BETUL:** ${item.correctAnswerText}`;

    }


    return text;

}


/* =====================================================
   SPLIT DISCORD MESSAGE
===================================================== */

function splitMessages(text, maxLength = 1900) {

    const messages = [];

    let current = "";


    const blocks =
        text.split("\n\n");


    blocks.forEach(block => {

        const test =
            current
            ? current + "\n\n" + block
            : block;


        if (test.length > maxLength) {

            if (current) {

                messages.push(current);

            }


            current = block;

        } else {

            current = test;

        }

    });


    if (current) {

        messages.push(current);

    }


    return messages;

}


/* =====================================================
   SEND SIMPLE DISCORD MESSAGE
===================================================== */

async function sendDiscordMessage(message) {

    try {

        const body =
            new URLSearchParams();


        body.append(
            "username",
            "RK GARAGE"
        );


        body.append(
            "content",
            message
        );


        await fetch(

            WEBHOOK_URL,

            {

                method: "POST",

                mode: "no-cors",

                headers: {

                    "Content-Type":
                        "application/x-www-form-urlencoded;charset=UTF-8"

                },

                body: body.toString()

            }

        );


        /*
         * no-cors response memang opaque.
         * Browser tidak boleh membaca status Discord.
         * Tetapi POST tetap dihantar.
         */

        return true;


    } catch (error) {

        console.error(
            "Discord Send Error:",
            error
        );

        return false;

    }

}


/* =====================================================
   SEND RESULT KE DISCORD
===================================================== */

async function sendToDiscord(data) {

    try {

        /* =================================================
           SUMMARY
        ================================================= */

        let summary = "";

        summary +=
            `🔧 **RK GARAGE — TEST SENIOR MEKANIK**\n\n`;

        summary +=
            `👤 **NAMA:** ${data.playerName}\n`;

        summary +=
            `🎖️ **PANGKAT SEKARANG:** ${data.currentRank}\n`;

        summary +=
            `🎯 **PANGKAT TUJUAN:** SENIOR MEKANIK\n`;

        summary +=
            `📊 **MARKAH:** ${data.score}/20\n`;

        summary +=
            `📈 **SCORE:** ${data.percentage}%\n`;

        summary +=
            `📋 **STATUS:** ${
                data.status === "LULUS"
                ? "🟢 LULUS"
                : "🔴 GAGAL"
            }\n`;

        summary +=
            `❓ **TIDAK DIJAWAB:** ${data.unanswered}\n`;

        if (data.autoSubmit) {

            summary +=
                `⏰ **MASA HABIS — AUTO SUBMIT**\n`;

        }


        summary +=
            `\n━━━━━━━━━━━━━━━━━━━━\n\n`;

        summary +=
            `📝 **DETAIL JAWAPAN**`;


        /* =================================================
           SEND SUMMARY
        ================================================= */

        const summarySuccess =
            await sendDiscordMessage(
                summary
            );


        if (!summarySuccess) {

            return false;

        }


        /* =================================================
           BUILD ALL QUESTIONS
        ================================================= */

        let allQuestions = "";


        data.details.forEach(item => {

            allQuestions +=
                buildQuestionMessage(item);

            allQuestions +=
                "\n\n";

        });


        /* =================================================
           SPLIT
        ================================================= */

        const messages =
            splitMessages(
                allQuestions,
                1900
            );


        /* =================================================
           SEND QUESTION CHUNKS
        ================================================= */

        for (
            let i = 0;
            i < messages.length;
            i++
        ) {

            let message =
                messages[i];


            if (messages.length > 1) {

                message =
                    `**📝 DETAIL ${i + 1}/${messages.length}**\n\n` +
                    message;

            }


            const sent =
                await sendDiscordMessage(
                    message
                );


            if (!sent) {

                return false;

            }


            /*
             * Jarak sedikit antara message
             * supaya tidak spam/rate-limit.
             */

            await new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        500
                    )
            );

        }


        return true;


    } catch (error) {

        console.error(
            "Discord Webhook Error:",
            error
        );

        return false;

    }

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(text) {

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}

</script>
